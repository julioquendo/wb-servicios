services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wbservicios
      POSTGRES_USER: wbservicios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbservicios -d wbservicios"]
      interval: 10s
      timeout: 5s
      retries: 5
  central:
    build: ./central
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://wbservicios:${POSTGRES_PASSWORD}@db:5432/wbservicios
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Configure ADMIN_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CENTRAL_PORT:-8080}:8000"
volumes:
  postgres_data:
